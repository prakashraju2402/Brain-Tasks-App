version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "589354718688"
    AWS_DEFAULT_REGION: "us-east-1"
    IMAGE_REPO_NAME: "brain-tasks-app"
    CLUSTER_NAME: "brain-tasks-cluster"

phases:
  install:
    commands:
      - echo Installing kubectl...
      - KVER=$(curl -Ls https://dl.k8s.io/release/stable.txt)
      - curl -LO "https://dl.k8s.io/release/${KVER}/bin/linux/amd64/kubectl"
      - chmod +x kubectl && mv kubectl /usr/local/bin/
      - kubectl version --client

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - echo Building the Docker image...
      - docker build -t $REPO_URI:latest .
      - docker tag $REPO_URI:latest $REPO_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo Pushing the Docker image to ECR...
      - docker push $REPO_URI:latest
      - docker push $REPO_URI:$IMAGE_TAG
      - echo Deploying to EKS...
      - aws eks update-kubeconfig --name $CLUSTER_NAME --region $AWS_DEFAULT_REGION
      - kubectl apply -f k8s/deployment.yaml
      - kubectl apply -f k8s/service.yaml
      - kubectl set image deployment/brain-tasks-app brain-tasks-app=$REPO_URI:$IMAGE_TAG
      - kubectl rollout status deployment/brain-tasks-app --timeout=300s
      - kubectl get pods
      - kubectl get svc brain-tasks-service
